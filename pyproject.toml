[project]
name = "cloud-diagnosis-assistant"
version = "0.1.0"
description = "Controlled cloud incident RCA agent primitives."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.scripts]
cloud-incident-rca = "cloud_incident_rca_agent.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]
integrations = [
    "openai>=1.0,<2.0",
    "socksio>=1.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require live external services or credentials",
]
